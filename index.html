<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti, mi amor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap">
<style>
:root{--bg:#05010a;--txt:#fbcfe8;--glow:#d946ef;--deep:#7c3aed;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 46%,rgba(168,85,247,.2),transparent 58%),var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#base{position:fixed;left:50%;border-radius:50%;background:radial-gradient(ellipse at center,#fff 0,#f5d0fe 18%,#d946ef 42%,#7c3aed 64%,transparent 72%);filter:blur(7px);animation:pulso 2.6s ease-in-out infinite;pointer-events:none}
@keyframes pulso{50%{opacity:.72;transform:scale(.94)}}
h1{position:fixed;top:calc(env(safe-area-inset-top,0px) + 5vh);left:0;right:0;margin:0;padding:0 16px;text-align:center;font:600 clamp(34px,10vw,60px)/1.1 'Dancing Script',cursive,Georgia,serif;color:var(--txt);text-shadow:0 0 16px var(--glow),0 0 42px var(--deep);pointer-events:none}
p{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);left:0;right:0;margin:0;text-align:center;font:16px/1.4 system-ui,sans-serif;color:var(--txt);opacity:.7;pointer-events:none}
#snd{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:50%;border:1px solid rgba(251,207,232,.4);background:rgba(0,0,0,.35);color:var(--txt);font-size:20px;cursor:pointer;z-index:5}
@media (prefers-reduced-motion:reduce){#base{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="base"></div>
<button id="snd" aria-label="Sonido">🔊</button>
<h1 id="titulo"></h1>
<p id="sub"></p>
<script>
// ---- Cambia estos textos para personalizarlo ----
const TITULO = "Para tii";
const SUBTITULO = "Tocar para el sonido 🎵 · arrastra para girarlo ✨";
// -------------------------------------------------
document.getElementById('titulo').textContent = TITULO;
document.getElementById('sub').textContent = SUBTITULO;

const cv = document.getElementById('c'), ctx = cv.getContext('2d'), base = document.getElementById('base');
const floatParticles = [], burstParticles = [], heartParticles = [], ringParticles = [];
const FLOAT_COUNT = 140, HEART_COUNT = 4200;
let W, H, S, cx, cy, yaw = 0, pitch = .25, dragY = 0, dragP = 0, velY = 0, velP = 0, down = false, lastX = 0, lastY = 0, blur = .3;

function project(x, y, z, a, pt) { // 3D -> pantalla con perspectiva (yaw + pitch)
  const c = Math.cos(a), s = Math.sin(a), cp = Math.cos(pt), sp = Math.sin(pt);
  const xr = x * c + z * s, zr = -x * s + z * c;
  const yr = y * cp + zr * sp, z2 = -y * sp + zr * cp;
  const k = 40 * S / (40 * S - z2);
  return { x: cx + xr * k, y: cy + yr * k, k };
}
const rnd = (a, b) => a + Math.random() * (b - a);
const blue = (l, f = Math.random()) => `hsl(${335 - f * 40 + rnd(0, 10)} ${rnd(80, 100)}% ${l}%)`; // rosado arriba, morado abajo
const hx = t => 16 * Math.pow(Math.sin(t), 3);
const hy = t => 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

function makeHeart() {
  heartParticles.length = 0;
  for (let i = 0; i < HEART_COUNT; i++) {
    const t = rnd(0, Math.PI * 2);
    const r = Math.random() < .2 ? rnd(.9, 1) : Math.sqrt(Math.random()); // volumen sólido, con un poco más de borde
    const ux = hx(t) * r + rnd(-.25, .25), uy = hy(t) * r + rnd(-.25, .25);
    const th = 10 * Math.sqrt(Math.max(0, 1 - r * r * .95)); // grosor redondeado (hinchado)
    const uz = rnd(-1, 1) * th; // relleno uniforme: una sola masa 3D, sin caras separadas
    heartParticles.push({ ux, uy, uz, k3: 1, x: cx + rnd(-30, 30), y: cy + rnd(-30, 30), px: 0, py: 0, vx: 0, vy: 0,
      ph: rnd(0, 6.28), sp: rnd(1.5, 4), sz: rnd(.7, 1.9), free: 0, k: rnd(.05, .09),
      R: rnd(5, 24), a0: rnd(0, 6.28),
      col: blue(Math.random() < .22 ? rnd(82, 95) : rnd(58, 78), (17 - uy) / 30) });
    const hp = heartParticles[heartParticles.length - 1]; hp.sw = rnd(.9, 2) * 12 / hp.R; // órbita del remolino: más rápido cerca del centro
  }
}

function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  S = Math.min(W * .024, H * .0135); cx = W / 2; cy = H * .46;
  const R = 11 * S, b = project(0, 17 * S, 0, 0, .25), bw = R * 2.8 * b.k, bh = bw * Math.sin(.25) * 1.15;
  base.style.width = bw + 'px'; base.style.marginLeft = -bw / 2 + 'px'; base.style.height = bh + 'px';
  base.style.top = (b.y - bh / 2) + 'px';
  ringParticles.length = 0;
  for (let i = 0; i < 320; i++) ringParticles.push({ th: rnd(0, 6.28), rr: R * rnd(.88, 1.12), dy: rnd(-.4, .4) * S, sz: rnd(.8, 1.9), ph: rnd(0, 6.28), col: blue(rnd(65, 92)) });
  makeHeart();
}

class Particle { // partículas flotantes y de ráfaga
  constructor(x, y, type) {
    this.type = type; this.x = x; this.y = y; this.px = x; this.py = y;
    this.sz = rnd(.8, 2.2); this.ph = rnd(0, 6.28);
    if (type === 'float') {
      this.maxLife = rnd(4, 9); this.life = Math.random() * this.maxLife;
      this.vx = rnd(-.15, .15); this.vy = rnd(-.5, -.1); this.col = blue(rnd(60, 92));
    } else {
      const t = rnd(0, Math.PI * 2), s = rnd(2, 7) * Math.min(1.3, S / 7);
      this.maxLife = this.life = rnd(.9, 1.7);
      this.vx = hx(t) / 16 * s; this.vy = -hy(t) / 16 * s; this.col = blue(rnd(60, 92));
    }
  }
  update(f, dt) {
    this.px = this.x; this.py = this.y;
    this.x += this.vx * f; this.y += this.vy * f;
    if (this.type === 'burst') { this.vx *= .965; this.vy *= .965; this.life -= dt; }
    else { this.life -= dt; if (this.life <= 0 || this.y < -10) { this.x = Math.random() * W; this.y = H + 5; this.px = this.x; this.py = this.y; this.life = this.maxLife; } }
  }
  get alpha() { return this.type === 'burst' ? Math.max(0, this.life / this.maxLife) : .25 + .5 * Math.abs(Math.sin(this.ph + this.life * 2)); }
}
for (let i = 0; i < FLOAT_COUNT; i++) floatParticles.push(new Particle(Math.random() * innerWidth, Math.random() * innerHeight, 'float'));

function spawnHeartBurst(x, y) { for (let i = 0; i < 140; i++) burstParticles.push(new Particle(x, y, 'burst')); }
function explode() {
  blur = 1; sparkle(6);
  for (const p of heartParticles) { p.vx = rnd(-7, 7) * S / 7; p.vy = -rnd(1, 15) * S / 7; p.free = rnd(.5, 1.6); }
}


// ---- Sonido de amor: música romántica + latido, generado con Web Audio (sin archivos) ----
let AC = null, master, rev, muted = false, nextBar = 0, bar = 0;
const m2f = m => 440 * Math.pow(2, (m - 69) / 12);
const CH = [[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]], BASS = [48,45,41,43];
const MEL = [[[0,76,1.4],[2,79,.9],[3,76,.9]],[[0,76,1.4],[2,72,.9],[3,74,.9]],[[0,72,1.4],[2,77,.9],[3,76,.9]],[[0,74,1.4],[2,71,.9],[3,67,1.6]]];
function tone(f, t0, dur, vol, type = 'sine') {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(master); g.connect(rev); o.start(t0); o.stop(t0 + dur + .05);
}
function thump(t0, vol) { // latido: seno grave que baja de tono
  const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(90, t0); o.frequency.exponentialRampToValueAtTime(40, t0 + .18);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + .25);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .3);
}
function playBar(t0) {
  const B = .62, c = CH[bar % 4];
  tone(m2f(BASS[bar % 4]), t0, B * 4, .16, 'sine');
  [0,1,2,3,2,1,2,3].forEach((k, i) => tone(m2f(c[k]), t0 + i * B / 2, 1.3, .07, 'triangle'));
  MEL[bar % 4].forEach(([b, m, d]) => tone(m2f(m), t0 + b * B, d, .11, 'sine'));
  for (let i = 0; i < 2; i++) { thump(t0 + i * B * 2, .22); thump(t0 + i * B * 2 + .24, .14); }
  bar++;
}
function pump() { while (nextBar < AC.currentTime + 2) { playBar(nextBar); nextBar += .62 * 4; } }
function sparkle(n) { if (!AC || muted) return; const P = [84,86,88,91,93,96]; for (let i = 0; i < n; i++) tone(m2f(P[Math.floor(Math.random() * P.length)]), AC.currentTime + i * .07, 1.5, .06, 'triangle'); }
function startAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
  try {
    AC = new A(); master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination);
    const len = AC.sampleRate * 2.6, buf = AC.createBuffer(2, len, AC.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4); }
    rev = AC.createConvolver(); rev.buffer = buf; const rg = AC.createGain(); rg.gain.value = .5; rev.connect(rg); rg.connect(master);
    nextBar = AC.currentTime + .1; pump(); setInterval(pump, 500);
  } catch (e) { AC = null; }
}
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('pointerdown', e => e.stopPropagation());
sndBtn.addEventListener('click', () => {
  if (!AC) { startAudio(); return; }
  muted = !muted; master.gain.setTargetAtTime(muted ? 0 : .6, AC.currentTime, .05); sndBtn.textContent = muted ? '🔇' : '🔊';
});

addEventListener('pointerup', () => down = false);
addEventListener('pointercancel', () => down = false);
addEventListener('pointermove', e => {
  if (!down) return;
  velY = (e.clientX - lastX) * .01; velP = (e.clientY - lastY) * .006;
  dragY += velY; dragP = Math.max(-.9, Math.min(.9, dragP + velP));
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointerdown', e => {
  down = true; lastX = e.clientX; lastY = e.clientY;
  startAudio(); sparkle(2);
  spawnHeartBurst(e.clientX, e.clientY);
  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 16 * S) explode();
});
addEventListener('resize', resize);

let last = performance.now(), t = 0, nextBlast = 4.5;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  const f = dt * 60;
  // Ciclo de 14 s: corazón (5s) -> se disuelve (2s) -> remolino girando (4s) -> se rearma (3s)
  const sm = x => x * x * (3 - 2 * x), ph = t % 14;
  const w = ph < 5 ? 0 : ph < 7 ? sm((ph - 5) / 2) : ph < 11 ? 1 : sm(1 - (ph - 11) / 3);
  if (w > .02) blur = Math.max(blur, .45);
  const beat = 1 + .025 * Math.sin(t * 2.2);
  if (!down) { dragY += velY; velY *= .95; dragP *= .985; }
  yaw = t * .45 + dragY;                        // giro continuo completo en 3D
  pitch = .25 + Math.sin(t * .4) * .08 + dragP;
  blur += (.3 - blur) * .04;                    // estelas largas al explotar, luego se enfoca

  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = `rgba(0,0,0,${blur > .31 ? .14 : .34})`; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  for (const p of heartParticles) {
    p.px = p.x; p.py = p.y;
    const sa = p.a0 + t * p.sw, v = 1 - w;
    const gx = p.ux * v + Math.cos(sa) * p.R * w, gz = p.uz * v + Math.sin(sa) * p.R * w;
    const gy = -(p.uy + 2.5) * v + (-(p.uy * .45 + 2.5) + Math.sin(sa * 1.5 + p.ph) * 3) * w;
    const q = project(gx * S * beat, gy * S * beat, gz * S * beat, yaw + w * t * .3, pitch);
    p.k3 = q.k;
    const tx = q.x + Math.sin(t * p.sp + p.ph) * 2, ty = q.y + Math.cos(t * p.sp + p.ph) * 2; // cada puntito gira un poquito
    if (p.free > 0) { p.free -= dt; p.vx += (tx - p.x) * .004 * f; p.vy += (ty - p.y) * .004 * f; p.vx *= .97; p.vy *= .97; }
    else { p.vx = (p.vx + (tx - p.x) * p.k * f) * .84; p.vy = (p.vy + (ty - p.y) * p.k * f) * .84; }
    p.x += p.vx * f; p.y += p.vy * f;
    const depth = Math.min(1.15, Math.max(.25, .3 + (p.k3 - .8) * 2.4)); // lo cercano brilla más, lo lejano se apaga
    ctx.globalAlpha = (.4 + .6 * Math.abs(Math.sin(t * p.sp + p.ph))) * depth;
    ctx.strokeStyle = p.col; ctx.lineWidth = p.sz * p.k3 * p.k3 * 1.15;
    ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x + .01, p.y); ctx.stroke();
  }
  for (const r of ringParticles) {
    const a = r.th + t * .7, q = project(Math.cos(a) * r.rr, 17 * S + r.dy, Math.sin(a) * r.rr, 0, .25);
    ctx.globalAlpha = (.25 + .75 * Math.min(1, Math.max(0, (q.k - .75) / .4))) * (.6 + .4 * Math.abs(Math.sin(t * 2 + r.ph)));
    ctx.strokeStyle = r.col; ctx.lineWidth = r.sz * q.k;
    ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x + .01, q.y); ctx.stroke();
  }
  for (const list of [floatParticles, burstParticles]) {
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i]; p.update(f, dt);
      if (p.type === 'burst' && p.life <= 0) { list.splice(i, 1); continue; }
      ctx.globalAlpha = p.alpha; ctx.strokeStyle = p.col; ctx.lineWidth = p.sz;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x + .01, p.y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>S
